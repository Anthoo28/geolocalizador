<header class="flex items-center justify-between mb-8 relative">
  <!-- Título de la vista / Breadcrumb -->
  <div class="flex items-center gap-2 text-sm text-slate-500">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    <span class="font-medium text-slate-800">Resumen General</span>
  </div>
  
  <!-- Acciones y Menú de Usuario -->
  <div class="flex items-center gap-4">
    
    <!-- Botón de Notificaciones -->
    <button class="relative p-2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
    </button>
    
    <!-- Contenedor del Perfil con Dropdown -->
    <div class="relative">
      <div 
        (click)="toggleDropdown()" 
        class="flex items-center gap-3 border-l border-slate-200 pl-4 cursor-pointer hover:opacity-80 transition-opacity">
        
        <!-- Avatar Dinámico usando las iniciales o el nombre -->
        <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold overflow-hidden shadow-inner">
          <img 
            [src]="'https://ui-avatars.com/api/?name=' + (usuario?.nombre || 'Juan') + '+' + (usuario?.apellido || '') + '&background=e0e7ff&color=4338ca'" 
            [alt]="usuario?.nombre || 'Usuario'">
        </div>
        
        <!-- Nombre y Rol -->
        <div class="hidden md:flex flex-col">
          <div class="flex items-center gap-1">
            <span class="text-sm font-semibold text-slate-800 leading-none">
              {{ usuario?.nombre ? (usuario.nombre + ' ' + (usuario.apellido || '')) : 'Juan Pérez' }}
            </span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>
          <span class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">
            {{ usuario?.rol || usuario?.role || 'ADMINISTRADOR' }}
          </span>
        </div>
      </div>

      <!-- Menú Desplegable (Cerrar Sesión) -->
      <div 
        *ngIf="isDropdownOpen" 
        class="absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-xl shadow-lg py-1 z-50">
        
        <div class="px-4 py-2 border-b border-slate-100 md:hidden">
          <p class="text-xs font-semibold text-slate-800">{{ usuario?.nombre }}</p>
          <p class="text-[10px] text-slate-500 uppercase">{{ usuario?.rol }}</p>
        </div>

        <button 
          (click)="cerrarSesion()" 
          class="w-full text-left px-4 py-2.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium cursor-pointer transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>

  </div>
</header>
