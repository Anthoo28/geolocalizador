<div class="flex h-screen bg-gray-100 overflow-hidden font-sans">

  <!-- COMPONENTE SIDEBAR REUTILIZABLE -->
  <app-sidebar></app-sidebar>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 bg-gray-100 overflow-y-auto flex flex-col p-6 lg:p-10">

    <!-- CABECERA DE LA SECCIÓN -->
    <div class="mb-6">
      <span class="text-xs font-bold text-indigo-700 tracking-wider uppercase mb-1 block">7. REPORTES</span>
      <h1 class="text-xl font-bold text-gray-900">Reportes</h1>[cite: 11]
    </div>

    <!-- CONTENEDOR PRINCIPAL BLANCO -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 lg:p-8 flex-1 flex flex-col">

      <!-- PESTAÑAS DE NAVEGACIÓN -->
      <div class="flex border-b border-gray-200 mb-6 gap-8">
        <button 
          (click)="tabActiva = 'generar'"
          [class]="tabActiva === 'generar' ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
          class="pb-3 border-b-2 text-sm transition cursor-pointer">
          Generar reporte
        </button>
        <button 
          (click)="tabActiva = 'historial'"
          [class]="tabActiva === 'historial' ? 'border-indigo-600 text-indigo-600 font-semibold' : 'border-transparent text-gray-500 hover:text-gray-700'"
          class="pb-3 border-b-2 text-sm transition cursor-pointer">
          Historial de reportes
        </button>
      </div>

      <!-- CONTENIDO DE LA PESTAÑA: GENERAR REPORTE -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1" *ngIf="tabActiva === 'generar'">

        <!-- COLUMNA IZQUIERDA: FORMULARIO DE FILTROS -->
        <div class="lg:col-span-7 space-y-5 flex flex-col justify-between">
          
          <div class="space-y-4">
            <!-- Tipo de reporte -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-700">Tipo de reporte</label>
              <select [(ngModel)]="reporte.tipoReporte" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-2.5 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option>Incidencias por periodo</option>
                <option>Incidencias por sector</option>
                <option>Incidencias por tipo de delito</option>
              </select>
            </div>

            <!-- Fechas (Inicio y Fin) -->
            <div class="grid grid-cols-2 gap-4">
              <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-700">Fecha inicio</label>
                <div class="relative">
                  <input type="date" [(ngModel)]="reporte.fechaInicio" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-2.5 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
              </div>
              <div class="space-y-1.5">
                <label class="block text-xs font-semibold text-gray-700">Fecha fin</label>
                <div class="relative">
                  <input type="date" [(ngModel)]="reporte.fechaFin" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-2.5 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
              </div>
            </div>

            <!-- Sector -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-700">Sector</label>
              <select [(ngModel)]="reporte.sector" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-2.5 text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option>Todos</option>
                <option>Sector Centro</option>
                <option>Sector Norte</option>
                <option>Sector Sur</option>
              </select>
            </div>

            <!-- Formato (PDF / Excel) -->
            <div class="space-y-1.5">
              <label class="block text-xs font-semibold text-gray-700">Formato</label>
              <div class="grid grid-cols-2 gap-4">
                <button 
                  type="button"
                  (click)="seleccionarFormato('PDF')"
                  [class]="reporte.formato === 'PDF' ? 'border-indigo-600 bg-indigo-50/50 text-indigo-700 font-bold' : 'border-gray-300 bg-white text-gray-700'"
                  class="border rounded-xl py-2.5 text-xs transition cursor-pointer shadow-sm">
                  PDF
                </button>
                <button 
                  type="button"
                  (click)="seleccionarFormato('Excel')"
                  [class]="reporte.formato === 'Excel' ? 'border-indigo-600 bg-indigo-50/50 text-indigo-700 font-bold' : 'border-gray-300 bg-white text-gray-700'"
                  class="border rounded-xl py-2.5 text-xs transition cursor-pointer shadow-sm">
                  Excel
                </button>
              </div>
            </div>
          </div>

          <!-- Botón Generar Reporte -->
          <button (click)="generarReporte()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs py-3 rounded-xl shadow-sm transition cursor-pointer mt-6">
            Generar reporte
          </button>

        </div>

        <!-- COLUMNA DERECHA: VISTA PREVIA DEL GRÁFICO -->
        <div class="lg:col-span-5 bg-gray-50 border border-gray-200 rounded-2xl p-6 flex flex-col justify-between">
          
          <div class="flex items-center justify-between mb-4">
            <span class="text-xs font-bold text-gray-700">Vista previa</span>
            <span class="text-gray-400 text-xs">▼</span>
          </div>

          <!-- Título y subtítulo del reporte -->
          <div class="text-center space-y-1 mb-4">
            <h3 class="text-sm font-bold text-gray-800">Incidencias por periodo</h3>
            <p class="text-[11px] text-gray-500">Del 01/05/2026 al 31/05/2026</p>
          </div>

          <!-- Gráfico Circular simulado con diseño limpio -->
          <div class="flex items-center justify-center my-auto py-2">
            <div class="relative w-40 h-40 rounded-full border-[16px] border-indigo-600 flex items-center justify-center shadow-inner" style="border-color: #2563eb #10b981 #f59e0b #ef4444 #8b5cf6;">
              <div class="w-20 h-20 bg-gray-50 rounded-full"></div>
            </div>
          </div>

          <!-- Leyenda de porcentajes del gráfico -->
          <div class="space-y-2 text-xs text-gray-600 px-4 mt-4">
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-600"></span>Robo</span>
              <span class="font-semibold text-gray-800">35%</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>Hurto</span>
              <span class="font-semibold text-gray-800">25%</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Accidente</span>
              <span class="font-semibold text-gray-800">20%</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-purple-600"></span>Violencia</span>
              <span class="font-semibold text-gray-800">12%</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-900"></span>Disturbios</span>
              <span class="font-semibold text-gray-800">8%</span>
            </div>
          </div>

          <!-- Total inferior -->
          <div class="text-center text-xs font-bold text-gray-800 mt-6 pt-3 border-t border-gray-200">
            Total: 120 incidencias
          </div>

        </div>

      </div>

      <!-- CONTENIDO DE LA PESTAÑA: HISTORIAL DE REPORTES -->
      <div class="flex-1 py-8 text-center text-gray-500 text-xs" *ngIf="tabActiva === 'historial'">
        No hay reportes previos generados en este historial.
      </div>

    </div>

  </main>
</div>
