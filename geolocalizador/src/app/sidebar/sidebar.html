<aside class="w-64 h-screen bg-[#0B1221] text-gray-400 flex flex-col font-sans justify-between border-r border-slate-800/40">
  
  <!-- CONTENEDOR SUPERIOR (Logo + Navegación) -->
  <div class="flex-1 overflow-y-auto">
    <!-- Cabecera / Logo -->
    <div class="h-20 flex items-center px-6 mb-2">
      <div class="flex items-center gap-3">
        <!-- Icono de Escudo de Seguridad -->
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-md shadow-blue-600/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <span class="text-white text-[15px] font-semibold tracking-wide">Seguridad Ica</span>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="px-3 py-2">
      <ul class="flex flex-col space-y-1">
        <ng-container *ngFor="let item of menuItems; let i = index">
          
          <!-- Línea divisoria justo antes de "Usuarios" (ítem con índice 4) -->
          <li *ngIf="i === 8" class="my-3 px-3">
            <div class="border-t border-slate-800/80"></div>
          </li>

          <li>
            <a [routerLink]="item.route" 
               routerLinkActive="bg-[#1C263A] text-white shadow-sm font-medium"
               [routerLinkActiveOptions]="{exact: false}"
               class="flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-medium hover:bg-[#151D2C] hover:text-gray-200 transition-all duration-200 cursor-pointer">
               
              <!-- Icono SVG -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
              </svg>
              
              {{ item.name }}
            </a>
          </li>
        </ng-container>
      </ul>
    </nav>
  </div>

</aside>
