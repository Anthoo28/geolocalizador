<div class="w-[1100px] h-[650px] bg-white rounded-3xl shadow-2xl overflow-hidden flex mx-auto my-auto relative">

  <!-- Toast / Popup Flotante (Éxito o Error) -->
  <div *ngIf="toastMessage" 
       [ngClass]="{
         'border-emerald-500 text-emerald-800 bg-emerald-50': toastType === 'success',
         'border-red-500 text-red-800 bg-red-50': toastType === 'error'
       }"
       class="fixed top-5 right-5 z-50 flex items-center w-full max-w-xs p-4 rounded-xl shadow-2xl border-l-4 transition-all duration-300" 
       role="alert">
      
      <!-- Icono de Éxito -->
      <div *ngIf="toastType === 'success'" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-emerald-600 bg-emerald-200 rounded-lg">
          <i class="fa-solid fa-check"></i>
      </div>

      <!-- Icono de Error -->
      <div *ngIf="toastType === 'error'" class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 text-red-600 bg-red-200 rounded-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <!-- Texto del mensaje -->
      <div class="ml-3 text-sm font-medium">
        {{ toastMessage }}
      </div>

      <!-- Botón para cerrar manualmente -->
      <button type="button" (click)="toastMessage = ''" class="ml-auto -mx-1.5 -my-1.5 text-gray-400 hover:text-gray-900 rounded-lg p-1.5 inline-flex h-8 w-8 items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
      </button>
  </div>

  <!-- LADO IZQUIERDO -->
  <div class="w-1/2 flex flex-col justify-center items-center px-16">

    <!-- Logo -->
    <div class="w-16 h-16 rounded-full bg-indigo-100 flex items-center justify-center mb-6">
      <i class="fa-solid fa-shield-halved text-3xl text-indigo-600"></i>
    </div>

    <h1 class="text-2xl font-bold text-center text-gray-800">
      Sistema de Gestión de
      <br>
      Incidencias de Seguridad Ciudadana
    </h1>

    <p class="text-gray-500 mt-2 mb-8">
      Cercado de Ica
    </p>

    <!-- Formulario Reactivo -->
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="w-full space-y-4">

      <!-- email -->
      <div class="relative">
        <span class="absolute left-4 top-3.5 text-gray-400">
          <i class="fa-regular fa-user"></i>
        </span>

        <input
          type="email"
          formControlName="email"
          placeholder="Correo electrónico"
          class="w-full border rounded-lg py-3 pl-11 pr-4 outline-none focus:ring-2 focus:ring-indigo-500"
          [ngClass]="{'border-red-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
        />
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-500 text-xs mt-1 pl-1">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">El email es obligatorio.</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un email válido.</span>
        </div>
      </div>

      <!-- Password -->
      <div class="relative">
        <span class="absolute left-4 top-3.5 text-gray-400">
          <i class="fa-solid fa-lock"></i>
        </span>

        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Contraseña"
          class="w-full border rounded-lg py-3 pl-11 pr-11 outline-none focus:ring-2 focus:ring-indigo-500"
          [ngClass]="{'border-red-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
        />

        <span (click)="togglePassword()" class="absolute right-4 top-3.5 text-gray-400 cursor-pointer hover:text-indigo-600">
          <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </span>

        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="text-red-500 text-xs mt-1 pl-1">
          La contraseña es obligatoria.
        </div>
      </div>

      <div class="text-center pt-1">
        <a href="#" class="text-sm text-gray-500 hover:text-indigo-600">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Botón de Envío -->
      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition disabled:opacity-50 flex items-center justify-center gap-2">
        <i *ngIf="isLoading" class="fa-solid fa-spinner fa-spin"></i>
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
      </button>

    </form>

    <p class="text-xs text-gray-400 mt-8">
      © 2026 Municipalidad de Ica
    </p>

  </div>

  <!-- LADO DERECHO -->
  <div class="w-1/2 relative bg-gradient-to-br from-sky-50 to-indigo-100">

    <img src="/ICA.png" alt="Ica" class="absolute inset-0 w-full h-full object-cover object-center select-none" draggable="false">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-white/30 backdrop-blur-[1px]"></div>

    <!-- Marcadores -->
    <div class="absolute top-20 right-28 w-16 h-16 rounded-full bg-white shadow-lg flex items-center justify-center">
      <i class="fa-solid fa-shield text-3xl text-indigo-600"></i>
    </div>

    <div class="absolute bottom-28 left-20 w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center">
      <i class="fa-solid fa-location-dot text-3xl text-blue-500"></i>
    </div>

    <div class="absolute bottom-20 right-24 w-14 h-14 rounded-full bg-white shadow-lg flex items-center justify-center">
      <i class="fa-solid fa-location-dot text-3xl text-red-500"></i>
    </div>

  </div>

</div>
